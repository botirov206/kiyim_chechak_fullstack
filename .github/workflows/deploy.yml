name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2 (PM2 + Nginx)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/var/www/kiyim-chechak"

            echo "==> Deploying Kiyim Chechak"
            echo "    Path:   ${APP_DIR}"
            echo "    Commit: ${{ github.sha }}"

            cd "${APP_DIR}"

            if [ ! -d .git ]; then
              echo "ERROR: ${APP_DIR} is not a git repo. Clone your fork first (see DEPLOYMENT.md)."
              exit 1
            fi

            git remote set-url origin "https://github.com/${{ github.repository }}.git"
            git fetch origin
            git reset --hard origin/master || git reset --hard origin/main

            echo "==> Building backend..."
            cd "${APP_DIR}/backend"
            npm ci --omit=dev
            npm run build
            npx prisma migrate deploy

            echo "==> Starting backend with PM2..."
            cd "${APP_DIR}"
            if pm2 describe kiyim-chechak-backend >/dev/null 2>&1; then
              pm2 restart kiyim-chechak-backend
            else
              pm2 start ecosystem.config.cjs
            fi
            pm2 save

            echo "==> Building frontend..."
            cd "${APP_DIR}/frontend"
            echo "VITE_API_URL=/api" > .env.production
            npm ci
            npm run build

            echo "==> Reloading Nginx..."
            sudo nginx -t
            sudo systemctl reload nginx

            echo "==> Health check..."
            curl -sf http://127.0.0.1:3000/api/health
            curl -sf http://127.0.0.1/api/health

            pm2 status
