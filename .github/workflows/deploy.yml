name: Build & Deploy to EC2

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  DOCKER_IMAGE_BACKEND: kurbanbayef/kiyim-chechak-backend
  DOCKER_IMAGE_FRONTEND: kurbanbayef/kiyim-chechak-frontend

jobs:
  build-and-push:
    name: Build Docker images & push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_BACKEND }}:latest
            ${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_FRONTEND }}:latest
            ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2 via Docker
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/var/www/kiyim-chechak"
            DEPLOY_DIR="${APP_DIR}/deploy"

            # Install Docker on first run
            if ! command -v docker &>/dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl git
              sudo install -m 0755 -d /etc/apt/keyrings
              sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
              sudo chmod a+r /etc/apt/keyrings/docker.asc
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
              sudo usermod -aG docker ubuntu
            fi

            # Clone or update repo
            if [ ! -d "${APP_DIR}/.git" ]; then
              sudo mkdir -p "${APP_DIR}"
              sudo chown ubuntu:ubuntu "${APP_DIR}"
              git clone https://github.com/kurbanbayefoo6-dev/kiyim_chechak_fullstack.git "${APP_DIR}"
            else
              cd "${APP_DIR}"
              git pull origin master || git pull origin main
            fi

            # Write backend .env from GitHub secrets
            cat > "${DEPLOY_DIR}/.env" << EOF
            NODE_ENV=production
            PORT=3000
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            CORS_ORIGIN=http://${{ secrets.EC2_HOST }}
            LOG_LEVEL=info
            EOF

            # Login to Docker Hub and pull latest images
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            cd "${DEPLOY_DIR}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Cleanup old images
            docker image prune -f

            echo "Deploy complete!"
            curl -sf http://localhost/api/health || echo "Health check pending..."
