services:
  postgres:
    image: postgres:16-alpine
    container_name: cloud-erp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloud_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
