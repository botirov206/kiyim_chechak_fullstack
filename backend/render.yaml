services:
  - type: web
    name: cloud-erp-crm-wms-backend
    runtime: node
    plan: free
    env: node
    region: oregon
    buildCommand: |
      NODE_ENV=development npm install
      npm run build
      npx prisma migrate deploy
      npx prisma db seed
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-erp-crm-wms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: cloud-erp-crm-wms-db
    databaseName: cloud_erp
    plan: free

