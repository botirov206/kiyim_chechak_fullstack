# Nginx config for Ubuntu EC2
# Frontend: static files from /var/www/kiyim-chechak/frontend/dist
# Backend:  proxy /api -> http://127.0.0.1:3000

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/kiyim-chechak/frontend/dist;
    index index.html;

    client_max_body_size 10M;

    # API -> Node.js backend (localhost only, not exposed publicly)
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # React SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
